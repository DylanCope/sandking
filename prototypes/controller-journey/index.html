<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sand-King Controller Journey Prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Three variants of the Claude Code Controller journey, switchable via ?variant=. -->
  <main id="app"></main>
  <nav class="switcher" aria-label="Prototype variants">
    <button id="previous" aria-label="Previous variant">←</button>
    <span id="variant-label"></span>
    <button id="next" aria-label="Next variant">→</button>
  </nav>
  <script type="module" src="prototype.js"></script>
</body>
</html>
